name: Unit Tests

on:
  push:
    branches: [main, "feat-*", "hotfix*", "release/*"]
  pull_request:
    branches: [main]

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: XCTest (macOS)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-spm-tests-${{ hashFiles('Package.swift', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-tests-
            ${{ runner.os }}-spm-

      - name: Run unit tests
        run: ./Scripts/run-tests.sh

      - name: Job summary
        if: always()
        run: |
          echo "### Unit tests" >> "$GITHUB_STEP_SUMMARY"
          echo "Runner: \`./Scripts/run-tests.sh\` (policy: docs/TESTING.md)" >> "$GITHUB_STEP_SUMMARY"
