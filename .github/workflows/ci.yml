name: CI

on:
  push:
    branches: [main, "feat-*", "hotfix*", "release/*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', '**/Package.resolved') }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Swift toolchain
        run: swift --version

      - name: Build
        run: |
          swift build --target TunForgeCore
          swift build --target TunForge

      - name: Unit tests (canonical)
        run: ./Scripts/run-tests.sh

      - name: Summarize
        if: always()
        run: |
          echo "### TunForge CI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: TunForgeCore + TunForge" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tests: \`./Scripts/run-tests.sh\` (XCTest — see docs/TESTING.md)" >> "$GITHUB_STEP_SUMMARY"
