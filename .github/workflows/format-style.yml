name: Lint

on:
  push:
    branches: [main, "feat-*", "hotfix*", "release/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format & Shell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install linters
        run: sudo apt-get update && sudo apt-get install -y clang-format-16 shellcheck

      - name: Check clang-format (TunForgeCore)
        run: |
          set -euo pipefail
          find Sources/TunForgeCore -type f \( -name '*.m' -o -name '*.mm' -o -name '*.h' -o -name '*.c' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format-16 --dry-run --Werror

      - name: Check shell scripts
        run: shellcheck Scripts/*.sh

      - name: Job summary
        if: always()
        run: |
          echo "### Lint" >> "$GITHUB_STEP_SUMMARY"
          echo "- Objective-C/C: clang-format 16" >> "$GITHUB_STEP_SUMMARY"
          echo "- Shell: shellcheck" >> "$GITHUB_STEP_SUMMARY"
