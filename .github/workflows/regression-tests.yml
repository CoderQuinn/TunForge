name: Regression Tests

on:
  push:
    branches: [main, "feat-*", "hotfix*", "release/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-tests:
    name: TCP Lifecycle Regressions (macOS)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-spm-regressions-${{ hashFiles('Package.swift', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-regressions-
            ${{ runner.os }}-spm-

      - name: Run regression tests
        run: ./Scripts/run-tests.sh regression

      - name: Job summary
        if: always()
        run: |
          echo "### Regression tests" >> "$GITHUB_STEP_SUMMARY"
          echo "Runner: \`./Scripts/run-tests.sh regression\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage: real TCP handshake, accept contract, and stack restart lifecycle" >> "$GITHUB_STEP_SUMMARY"
